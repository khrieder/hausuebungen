<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haus&uuml;bungen - Deutsch PTS</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02);
        }
        h1 {
            color: #0f172a;
            font-size: 1.8rem;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .last-update {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: normal;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge.active {
            background-color: #dbeafe;
            color: #1e40af;
        }
        .badge.done {
            background-color: #d1fae5;
            color: #065f46;
        }
        .badge.closed {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid rgba(71, 85, 105, 0.15);
        }
        @media (max-width: 600px) {
            h1 {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            .last-update {
                align-self: flex-start;
            }
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                margin-bottom: 15px;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 10px;
                background: #f8fafc;
            }
            td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
            }
            td:before {
                position: absolute;
                top: 50%;
                left: 10px;
                transform: translateY(-50%);
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: bold;
                color: #475569;
            }
            td:nth-of-type(1):before { content: "H\00DC Nr."; }
            td:nth-of-type(2):before { content: "Inhalt"; }
            td:nth-of-type(3):before { content: "Aufgegeben"; }
            td:nth-of-type(4):before { content: "Abgabe bis"; }
            td:nth-of-type(5):before { content: "Status"; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>&#128218; Haus&uuml;bungen - Deutsch PTS</span>
            <span class="last-update">Stand: 14.09.2026 17:24</span>
        </h1>
        <table>
            <thead>
                <tr>
                    <th style="width: 12%">Nr.</th>
                    <th style="width: 53%">Haus&uuml;bung</th>
                    <th style="width: 15%">Aufgegeben</th>
                    <th style="width: 12%">Abgabe bis</th>
                    <th style="width: 8%">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan='5' style='text-align:center; color:#64748b; padding: 20px;'>Aktuell keine Haus&uuml;bungen eingetragen.</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
