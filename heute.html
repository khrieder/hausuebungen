            justify-content: space-between;

            font-weight: 800;

            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;

        .day-switcher {
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: var(--bg-card-subtle);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            gap: 4px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);

            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.82rem;

            content: '';
            position: absolute;
            top: 4px;
            right: 8px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);

            margin: 0 auto;

            font-weight: 700;
            padding: 4px 8px;

                background: #7e22ce30;

            border-radius: var(--radius-card);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);

        .duty-icon {
            font-size: 1.5rem;
            line-height: 1;
        }
        .duty-content h3 {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--duty-text);
        }
        .duty-content p {
            font-size: 0.8rem;
            color: var(--duty-text);

            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;

            border-radius: 10px;
            font-size: 0.8rem;

            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;

            color: var(--text-main);

        details.accordion {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 6px;

            font-weight: 700;

        }
        details.accordion[open] summary::after {
            transform: rotate(180deg);
        }
        .accordion-content {
            padding-top: 10px;
            font-size: 0.84rem;
        }

        .verlauf-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0 14px 0;
            font-size: 0.78rem;

            border-radius: 8px;

            font-weight: 500;
            display: inline-flex;
            align-items: center;

            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>

                <button class="day-tab ${idx === currentDayIdx ? 'active' : ''} ${d.is_today ? 'today-marker' : ''}" onclick="switchDay(${idx})">
                    ${d.weekday.substring(0, 2)}
                    <span class="weekday-sub">${d.formatted_date.split('.')[0]}.${d.formatted_date.split('.')[1]}</span>
                </button>
            `).join('');
        }

        function switchDay(idx) {
            currentDayIdx = idx;
            renderDayNav();
            renderTimeline();
        }

        function renderTimeline() {
            const day = appData[currentDayIdx];
            document.getElementById('header-date').innerText = `${day.weekday}, ${day.formatted_date}`;
            const root = document.getElementById('timeline-root');

            if (!day.timeline || day.timeline.length === 0) {
                root.innerHTML = '<div class="empty-day">Keine Stunden für diesen Tag erfasst.</div>';
                return;
            }

            root.innerHTML = day.timeline.map((item, idx) => {
                if (item.type === 'pause') {
                    return `
                        <div class="duty-card">
                            <div class="duty-icon">👀</div>
                            <div class="duty-content">
                                <h3>${item.fach} • ${item.time_str}</h3>

                            </div>

                    `;

                const hasDetails = hasVerlauf || hasTafel || hasFiles || item.notizen;

                if (hasVerlauf) {
                    verlaufHtml = `

                            <thead>

                                        <td>${v.sozial || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>

                if (hasTafel) {
