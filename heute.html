_name": "1. Stunde", "time_str": "08:00 – 08:50", "fach": "DGB", "klasse": "1z", "raum": "", "thema": "Handy – Fluch oder Segen? & Eigene Medienwelten (YouTube & CapCut)", "materialien": "Beamer/PC, PowerPoint `Smartphone Pro und Contra.pptx`, Arbeitsblatt `handy-fluch-oder-segen_2150.docx`, `Handy - Fluch oder Segen.docx`, `handy-nutzung_2540.docx`, `02_Arbeitsblatt_Handy_Steckbrief.docx`, `Info_CapCut_Lehrerblatt.md`", "verlauf": [{"zeit": "00–10 Min (Einstieg & Spotlight)", "inhalt": "**Schüler-Videos & CapCut-Spotlight (optional) / PowerPoint-Einstieg:**\n•  1–2 Schüler:innen zeigen kurz selbst produzierte Kurzvideos (YouTube Shorts) am Beamer oder direkter Einstieg mit `Smartphone Pro und Contra.pptx` am Beamer.\n•  DGB-Gedanke zu CapCut: Recht am eigenen Bild & Privatsphäre (Wer darf mein Gesicht und mein Zimmer auf YouTube sehen?).", "sozial": "Plenum / Beamer & PowerPoint"}, {"zeit": "10–25 Min (Brückenschlag & Diskussion)", "inhalt": "**Überleitung „Smartphone Pro und Contra“ & Gruppendiskussion:**\n•  Gemeinsames Durchgehen der PowerPoint `Smartphone Pro und Contra.pptx` am Beamer.\n•  Impulsfrage: *„Wann ist das Smartphone ein SEGEN – und wann wird es zum FLUCH?“*\n•  Gruppendiskussion & Stichworte an der Tafel sammeln (Zeitfresser, Schlafstörungen, Ablenkung bei HÜs vs. Erreichbarkeit, Lernen, Kreativität).", "sozial": "L-S-Gespräch / Gruppendiskussion / Tafel"}, {"zeit": "25–42 Min (Erarbeitung)", "inhalt": "**Arbeitsblatt „Handy – Fluch oder Segen?“ (`handy-fluch-oder-segen_2150.docx`):**\n•  Austeilen des Arbeitsblattes an alle Schüler:innen (Einzelarbeit).\n•  **Aufgabe 1 (Die Handy-Waage):** Je 3–4 konkrete Pro- und Contra-Argumente eintragen.\n•  **Aufgabe 2 (Persönliches Fazit):** Kurze schriftliche Begründung: Zu welcher Seite neigt sich die eigene Waage?", "sozial": "Einzelarbeit / Arbeitsblatt `handy-fluch-oder-segen_2150.docx`"}, {"zeit": "42–50 Min (Klassen-Check & Abschluss)", "inhalt": "**Handy-Barometer & Merksatz:**\n•  2–3 Schüler:innen lesen ihre stärksten Argumente und ihr Fazit vor.\n•  Kurzes Meinungsbild per Handzeichen & 2 konkrete Klassen-Tipps für gesunde Handynutzung.\n•  Merksatz sichern; Arbeitsblätter einheften bzw. einsammeln.", "sozial": "Plenum / Tafel"}], "tafelbild": "```text\nHANDY: FLUCH ODER SEGEN?\n\nSEGEN (Vorteile):\n  + Schnelle Hilfe & Notruf bei Verspätungen\n  + Kontakt zu Freunden und Verwandten über Distanzen\n  + Kreatives Gestalten (Fotos, CapCut-Videos, Musik)\n  + Schnelles Wissen & digitale Lern-Apps (Anton, Quizlet)\n  + Zuverlässige Orientierung & Karten unterwegs\n\nFLUCH (Gefahren & Risiken):\n  - Die Zeit völlig vergessen (\"Nur noch 5 Minuten...\")\n  - Ständige Ablenkung beim Lernen und bei Hausübungen\n  - Schlafprobleme durch blaues Displaylicht und Nacht-Nachrichten\n  - Kettenbriefe, Ausgrenzung & Beleidigungen in Klassen-Chats\n  - Bewegungsmangel: Sofa daddeln statt Fußballplatz\n\nMERKSATZ:\nDas Smartphone ist ein Werkzeug. Du entscheidest, wer die Kontrolle hat:\nNutzt du es als praktischen Segen - oder stiehlt es dir als Fluch deine Zeit?\n```", "notizen": "", "files": [{"name": "02_Arbeitsblatt_Handy_Steckbrief.docx", "ext": ".docx", "size_kb": 17.1}, {"name": "Handy - Fluch oder Segen.docx", "ext": ".docx", "size_kb": 29.4}, {"name": "Info_CapCut_Lehrerblatt.docx", "ext": ".docx", "size_kb": 36.1}, {"name": "Info_CapCut_Lehrerblatt.md", "ext": ".md", "size_kb": 3.2}, {"name": "Smartphone Pro und Contra.pptx", "ext": ".pptx", "size_kb": 6817.5}, {"name": "Stundenablauf_1a_DGB_2026-10-21.docx", "ext": ".docx", "size_kb": 29.4}, {"name": "Stundenablauf_1z_DGB_2026-11-11.md", "ext": ".md", "size_kb": 3.7}, {"name": "YouTube – Musikvideos.docx", "ext": ".docx", "size_kb": 22.7}, {"name": "handy-fluch-oder-segen_2150.docx", "ext": ".docx", "size_kb": 134.5}, {"name": "handy-nutzung_2540.docx", "ext": ".docx", "size_kb": 121.2}], "folder_path": "C:\\Users\\karlh\\OneDrive - NMS Boeheimkirchen\\01 Antigravity Dateien\\01 Schuljahr 2026_27\\1z Digitale Grundbildung\\Stundenvorbereitungen\\05 Mittwoch, 11. November 2026"}, {"type": "unterricht", "slot_name": "2. Stunde", "time_str": "08:50 – 09:40", "fach": "Deutsch", "klasse": "4yz", "raum": "3a", "thema": "Rückgabe der 1. Deutsch-Schularbeit & Grammatik/Rechtschreibung – Verben und Adjektive nominalisieren (Sprachbuch S. 54/55 & S. 132/133)", "materialien": "", "verlauf": [{"zeit": "Zeit", "inhalt": "Phase", "sozial": "Inhalt & Lehrerimpulse"}, {"zeit": "00–10 Min", "inhalt": "**SA-Rückgabe, Einstieg & Tafel-Heftaufschrieb**", "sozial": "• **Rückgabe der 1. Deutsch-Schularbeit** (Austeilen der Hefte/Korrekturblätter & kurzer Hinweis zur Verbesserung).\n• Einstiegsimpuls an der Tafel: Gegenüberstellung zweier Sätze:\n  1. *Kaffee **trinken** die Großeltern gern.* (Verb ➔ klein)\n  2. *Beim **Trinken** des Kaffees schalte ich ab.* (Nomen ➔ groß)\n• Gemeinsames Erarbeiten der **4 Signalwort-Gruppen** und farbiger Aufschrieb ins SÜ-Heft (siehe Tafelbild unten)."}, {"zeit": "10–25 Min", "inhalt": "**Schreibphase 1: Sprachbuch S. 54 & 55**", "sozial": "• Aufschlagen des Sprachbuchs auf **S. 54/55**.\n• **Aufgabe 24 (im Buch):** Verben groß oder klein einsetzen.\n• **Aufgabe 25 (S. 54 – ins SÜ-Heft!):** Den gesamten Absatz (*„Ein wesentliches Kennzeichen meiner Arbeitsweise...“*) in korrekter Groß- und Kleinschreibung vollständig ins SÜ-Heft schreiben (7 Nominalisierungen unterstreichen!).\n• **Aufgabe 27 & 28 (S. 55 – ins SÜ-Heft!):** Wortgruppen umbauen (*das Freundliche des Morgens...*) und die 5 Sätze mit unbestimmten Zahlwörtern (*viel Schönes, manches Abenteuerliche...*) vollständig ins Heft schreiben."}, {"zeit": "25–30 Min", "inhalt": "**Zwischen-Vergleich am Beamer (S. 54/55)**", "sozial": "• Öffnen der Datei `SB_S_54_55_Wahre_Schoenheit_Sprache_erforschen.html` am Beamer.\n• Gemeinsamer Vergleich von Aufgabe 24, 25, 27 und 28. Schüler hakeln ab bzw. bessern Fehler im Heft sofort mit Farbstift aus."}, {"zeit": "30–45 Min", "inhalt": "**Schreibphase 2: Vertiefung S                             ${item.files.map(f => `
                                <div class="file-chip">
                                    <span>${f.ext === '.docx' ? '📝' : f.ext === '.pdf' ? '📄' : f.ext === '.pptx' ? '📊' : f.ext === '.jpg' ? '🖼️' : '📁'}</span>
                                    <span>${f.name}</span>
                                    <span style="opacity:0.6; font-size:0.65rem;">(${f.size_kb} KB)</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                let notizenHtml = '';
                if (item.notizen) {
                    notizenHtml = `
                        <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:8px; font-style:italic;">
                            💡 ${item.notizen}
                        </div>
                    `;
                }

                return `
                    <div class="lesson-card">
                        <div class="card-header">
                            <span class="slot-pill">
                                ⏱️ ${item.slot_name} (${item.time_str})
                            </span>
                            <div class="badges-right">
                                <span class="class-pill">${item.klasse ? item.klasse + ' ' : ''}${item.fach}</span>
                                ${item.raum ? `<span class="room-pill">Raum ${item.raum}</span>` : ''}
                            </div>
                        </div>

                        <div class="lesson-title">${item.thema}</div>

                        ${item.materialien ? `
                            <div class="material-box">
                                <span>📚</span>
                                <div><strong>Material:</strong> ${item.materialien}</div>
                            </div>
                        ` : ''}

                        ${hasDetails ? `
                            <details class="accordion">
                                <summary>Details & Verlaufsplan einblenden</summary>
                                <div class="accordion-content">
                                    ${notizenHtml}
                                    ${verlaufHtml}
                                    ${tafelHtml}
                                    ${filesHtml}
                                </div>
                            </details>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initial render
        renderDayNav();
        renderTimeline();
    </script>
</body>
</html>
