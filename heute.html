 kurze Stichwort-Begründung.\n•  **Aufgabe 2 (Die 4 großen KI-Bereiche im Alltag):** Zu zweit oder allein bearbeiten:\n  1. **Gesichtserkennung** (Face-ID, Fotos sortieren)\n  2. **Spracherkennung** (Siri, WhatsApp-Sprachmemo transkribieren)\n  3. **Empfehlungssysteme** (TikTok For-You-Page, YouTube, Spotify)\n  4. **Chatbots** (ChatGPT, Kundenservice-Bots)", "sozial": "Partner- oder Einzelarbeit\n\nArbeitsblatt"}, {"zeit": "34–43 Min *(Vergleich & Diskussion)*", "inhalt": "**Ergebnis-Check & Stolpersteine von KI:**\n•  Gemeinsames Vergleichen von Aufgabe 1 und den 4 Alltagsbereichen.\n•  **Gezielte Impulsfragen an die Klasse:**\n  – *„Warum versteht Siri starken niederösterreichischen Dialekt manchmal falsch?“* (Zu wenige Dialekt-Trainingsdaten!)\n  – *„Was ist das Problem bei TikTok/YouTube, wenn die KI euch nur noch das zeigt, was ihr sowieso schon mögt?“* (Filterblase / Einseitigkeit!)", "sozial": "Plenum\n\nArbeitsblatt & Lösungsblatt"}, {"zeit": "43–50 Min *(Sicherung & Puffer)*", "inhalt": "**Aufgabe 3 (Mein KI-Merksatz) & Pufferaufgabe 4:**\n•  Jeder Schüler formuliert in **Aufgabe 3** in 2 eigenen Sätzen, was KI ist, und liest ihn auf Wunsch vor.\n•  **Puffer für Schnelle (Aufgabe 4):** *„Wo hat eine KI bei dir schon einmal komplett versagt?“* (Lustige Autokorrektur-Fehler, falsche Sprachbefehle oder erfundenes Wissen bei ChatGPT).\n•  Einheften des Arbeitsblatts in die DGB-Mappe.", "sozial": "Einzelarbeit / Plenum\n\nDGB-Mappe"}], "tafelbild": "================================================================================\n   UE 03: WAS IST KÜNSTLICHE INTELLIGENZ (KI)?\n================================================================================\n\n  💻 NORMALE SOFTWARE                       🤖 KÜNSTLICHE INTELLIGENZ (KI)\n  (z. B. Taschenrechner, Wecker, Word)      (z. B. Face-ID, TikTok-Feed, ChatGPT)\n  ------------------------------------      ------------------------------------\n  • Folgt starren WENN-DANN-Regeln,         • Bekommt riesige Mengen an Beispielen\n    die ein Programmierer fix eingibt.        (= TRAININGSDATEN).\n  • Lernt NICHT selbstständig dazu.         • Erkennt selbstständig MUSTER und\n  • Liefert immer exakt dasselbe              trifft VORHERSAGEN.\n    Ergebnis (2 + 2 = 4).                   • Kann dazugelerntes Wissen auf neue\n                                              Situationen anwenden (macht aber\n                                              manchmal auch Fehler!).\n\n  🔑 DIE 3 SCHLÜSSELWÖRTER FÜR KI:\n     [ 1. Trainingsdaten ]  ➔  [ 2. Muster erkennen ]  ➔  [ 3. Vorhersage treffen ]\n================================================================================", "notizen": "", "files": [{"name": "Arbeitsblatt_4b_DGB_Was_ist_KI.docx", "ext": ".docx", "size_kb": 38.0}, {"name": "Arbeitsblatt_4b_DGB_Was_ist_KI.md", "ext": ".md", "size_kb": 5.4}, {"name": "Loesungsblatt_4b_DGB_Was_ist_KI.docx", "ext": ".docx", "size_kb": 38.2}, {"name": "Loesungsblatt_4b_DGB_Was_ist_KI.md", "ext": ".md", "size_kb": 4.0}, {"name": "Stundenablauf_4b_DGB_2026-10-23.docx", "ext": ".docx", "size_kb": 38.5}, {"name": "Stundenablauf_4b_DGB_2026-10-23.md", "ext": ".md", "size_kb": 6.1}], "folder_path": "C:\\Users\\karlh\\OneDrive - NMS Boeheimkirchen\\01 Antigravity Dateien\\01 Schuljahr 2026_27\\4b Digitale Grundbildung\\Stundenvorbereitungen\\03 Freitag, 23. Oktober 2026"}, {"type": "unterricht", "slot_name": "4. Stunde", "time_str": "10:45 – 11:35", "fach": "Deutsch", "klasse": "PTS", "raum": "", "thema": "❌ ENTFÄLLT heute (Freitag, 23.10.2026)", "materialien": "", "verlauf": [], "tafelbild": "", "notizen": "", "files": [], "folder_path": ""}]}];
        let currentDayIdx = appData.findIndex(d => d.is_today);
        if (currentDayIdx === -1) currentDayIdx = 0;

        function renderDayNav() {
            const nav = document.getElementById('day-nav');
            nav.innerHTML = appData.map((d, idx) => `
                <button class="day-tab ${idx === currentDayIdx ? 'active' : ''} ${d.is_today ? 'today-marker' : ''}" onclick="switchDay(${idx})">
                    ${d.weekday.substring(0, 2)}
                    <span class="weekday-sub">${d.formatted_date.split('.')[0]}.${d.formatted_date.split('.')[1]}</span>
                </button>
            `).join('');
        }

        function switchDay(idx) {
            currentDayIdx = idx;
            renderDayNav();
            renderTimeline();
        }

        function renderTimeline() {
            const day = appData[currentDayIdx];
            document.getElementById('header-date').innerText = `${day.weekday}, ${day.formatted_date}`;
            const root = document.getElementById('timeline-root');

            if (!day.timeline || day.timeline.length === 0) {
                root.innerHTML = '<div class="empty-day">Keine Stunden für diesen Tag erfasst.</div>';
                return;
            }

            root.innerHTML = day.timeline.map((item, idx) => {
                if (item.type === 'pause') {
                    return `
                        <div class="duty-card">
                            <div class="duty-icon">👀</div>
                            <div class="duty-content">
                                <h3>${item.fach} • ${item.time_str}</h3>
                                <p><strong>Ort:</strong> ${item.raum || 'Schulgebäude'}</p>
                            </div>
                        </div>
                    `;
                }

                // Unterricht Card
                const hasVerlauf = item.verlauf && item.verlauf.length > 0;
                const hasTafel = item.tafelbild && item.tafelbild.trim().length > 0;
                const hasFiles = item.files && item.files.length > 0;
                const hasDetails = hasVerlauf || hasTafel || hasFiles || item.notizen;

                let verlaufHtml = '';
                if (hasVerlauf) {
                    verlaufHtml = `
                        <div style="font-weight:700; margin-bottom:4px; font-size:0.8rem; color:var(--text-muted);">⏱️ VERLAUFSPLAN</div>
                        <table class="verlauf-table">
                            <thead>
                                <tr><th>Phase</th><th>Inhalt & Lehrerimpuls</th><th>Form / Mat.</th></tr>
                            </thead>
                            <tbody>
                                ${item.verlauf.map(v => `
                                    <tr>
                                        <td class="phase-time">${v.zeit}</td>
                                        <td class="phase-content">${v.inhalt}</td>
                                        <td>${v.sozial || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }

                let tafelHtml = '';
                if (hasTafel) {
                    tafelHtml = `
                        <div style="font-weight:700; margin-bottom:4px; font-size:0.8rem; color:var(--text-muted);">📌 TAFELBILD</div>
                        <div class="tafel-box">${item.tafelbild}</div>
                    `;
                }

                let filesHtml = '';
                if (hasFiles) {
                    filesHtml = `
                        <div style="font-weight:700; margin-top:10px; margin-bottom:4px; font-size:0.8rem; color:var(--text-muted);">📂 DATEIEN IM ORDNER (${item.files.length})</div>
                        <div class="file-chips">
                            ${item.files.map(f => `
                                <div class="file-chip">
                                    <span>${f.ext === '.docx' ? '📝' : f.ext === '.pdf' ? '📄' : f.ext === '.pptx' ? '📊' : f.ext === '.jpg' ? '🖼️' : '📁'}</span>
                                    <span>${f.name}</span>
                                    <span style="opacity:0.6; font-size:0.65rem;">(${f.size_kb} KB)</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                let notizenHtml = '';
                if (item.notizen) {
                    notizenHtml = `
                        <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:8px; font-style:italic;">
                            💡 ${item.notizen}
                        </div>
                    `;
                }

                return `
                    <div class="lesson-card">
                        <div class="card-header">
                            <span class="slot-pill">
                                ⏱️ ${item.slot_name} (${item.time_str})
                            </span>
                            <div class="badges-right">
                                <span class="class-pill">${item.klasse ? item.klasse + ' ' : ''}${item.fach}</span>

                        <div class="lesson-title">${item.thema}</div>

                        ${item.materialien ? `
                            <div class="material-box">

                            </div>
                        ` : ''}

                        ${hasDetails ? `
