                            return `<li><strong>${b.weekday_short}, ${b.german_date}:</strong> ${b.raw_hours} Std.${tagStr}</li>`;
                        }).join('');

                        saCountdownHtml = `
                            <div class="sa-mobile-box ${cClass}">
                                <details>
                                    <summary>
                                        <span>⏳ <strong>Noch ${sc.total_hours} Std.</strong> bis ${sc.sa_short_label} (${sc.sa_date_formatted}) <span style="font-weight:500; opacity:0.85;">• ${sc.hours_after_today} Std. nach heute</span></span>
                                    </summary>
                                    <ul class="sa-mobile-list">
                                        ${bRows}
                                        <li class="is-target">🎯 ${sc.sa_date_formatted}: ${sc.sa_title}</li>
                                    </ul>
                                </details>
                            </div>
                        `;
                    }
                }

                return `
                    <div class="lesson-card">
                        <div class="card-header">
                            <span class="slot-pill">
                                ⏱️ ${item.slot_name} (${item.time_str})
                            </span>
                            <div class="badges-right">
                                <span class="class-pill">${item.klasse ? item.klasse + ' ' : ''}${item.fach}</span>
                                ${item.raum ? `<span class="room-pill">Raum ${item.raum}</span>` : ''}
                            </div>
                        </div>

                        <div class="lesson-title">${item.thema}</div>

                        ${saCountdownHtml}

                        ${item.materialien ? `
                            <div class="material-box">
                                <span>📚</span>
                                <div><strong>Material:</strong> ${item.materialien}</div>
                            </div>
                        ` : ''}

                        ${hasDetails ? `
                            <details class="accordion">
                                <summary>Details & Verlaufsplan einblenden</summary>
                                <div class="accordion-content">
                                    ${notizenHtml}
                                    ${verlaufHtml}
                                    ${tafelHtml}
                                    ${filesHtml}
                                </div>
                            </details>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initial render
        renderDayNav();
        renderTimeline();
    </script>
</body>
</html>
