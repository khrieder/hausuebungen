            line-height: 1.45;

            display: flex;

        }
        .app-title-group h1 {
            font-size: 1.35rem;
            font-weight: 800;

        .app-title-group p {
            font-size: 0.8rem;

            font-weight: 500;
        }
        .live-badge {
            background: #22c55e20;
            color: #16a34a;
            border: 1px solid #22c55e40;

            font-weight: 700;

            letter-spacing: 0.04em;

        /* Segmented Week Day Selector */
        .day-switcher {
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: var(--bg-card-subtle);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            gap: 4px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);

            flex: 1;
            padding: 8px 2px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.82rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .day-tab .weekday-sub {
            display: block;
            font-size: 0.68rem;
            font-weight: 500;
            opacity: 0.8;
            margin-top: 1px;
        }
        .day-tab.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-weight: 700;
        }
        .day-tab.today-marker {
            position: relative;
        }
        .day-tab.today-marker::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 8px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
        }

        /* Container */
        .timeline-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;

        /* Cards */
        .lesson-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border);

            background: var(--primary-bg);

            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badges-right {
            display: flex;
            gap: 6px;
            align-items: center;

        .class-pill {
            background: var(--bg-card-subtle);
            color: var(--text-main);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-pill);

            background: #f3e8ff;
            color: #7e22ce;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: var(--radius-pill);
        }
        @media (prefers-color-scheme: dark) {
            .room-pill {
                background: #7e22ce30;
                color: #d8b4fe;
            }

        .duty-card {
            background: var(--duty-bg);
            border: 1.5px solid var(--duty-border);
            border-radius: var(--radius-card);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);

        .duty-icon {
            font-size: 1.5rem;

        }
        .duty-content h3 {

            font-weight: 800;
            color: var(--duty-text);
        }
        .duty-content p {
            font-size: 0.8rem;
            color: var(--duty-text);
            opacity: 0.9;
        }

        .lesson-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.35;
        }
        .material-box {
            background: var(--bg-card-subtle);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .material-box strong {
            color: var(--text-main);
        }

        /* Accordion */
        details.accordion {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 6px;
        }
        details.accordion summary {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            padding: 4px 0;
        }
        details.accordion summary::-webkit-details-marker {
            display: none;
        }
        details.accordion summary::after {
            content: '▼';
            font-size: 0.65rem;
            transition: transform 0.2s ease;
        }
        details.accordion[open] summary::after {
            transform: rotate(180deg);
        }
        .accordion-content {
            padding-top: 10px;
            font-size: 0.84rem;
        }

        /* Verlaufsplan Table */
        .verlauf-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0 14px 0;
            font-size: 0.78rem;
        }
        .verlauf-table th, .verlauf-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .verlauf-table th {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
        }
        .verlauf-table td.phase-time {
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
            width: 25%;
        }
        .verlauf-table td.phase-content {
            white-space: pre-line;
        }

        .tafel-box {
            background: #0f172a;
            color: #38bdf8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.76rem;
            padding: 12px;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-x: auto;
            margin: 8px 0 12px 0;
            border: 1px solid #334155;
            line-height: 1.4;
        }

        .file-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .file-chip {
            background: var(--bg-card-subtle);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        function renderDayNav() {

                </button>

        }

        function switchDay(idx) {
            currentDayIdx = idx;
            renderDayNav();
            renderTimeline();
        }

        function renderTimeline() {
            const day = appData[currentDayIdx];
            document.getElementById('header-date').innerText = `${day.weekday}, ${day.formatted_date}`;
            const root = document.getElementById('timeline-root');

            if (!day.timeline || day.timeline.length === 0) {
                root.innerHTML = '<div class="empty-day">Keine Stunden für diesen Tag erfasst.</div>';
                return;
            }

            root.innerHTML = day.timeline.map((item, idx) => {
                if (item.type === 'pause') {
                    return `

                            <div class="duty-icon">👀</div>
                            <div class="duty-content">

                if (hasVerlauf) {

                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;

                let tafelHtml = '';
                if (hasTafel) {

                let filesHtml = '';

                                    <span>${f.name}</span>
