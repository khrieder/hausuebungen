beweisen; schwerer Betrug.", "sozial": "Einzelarbeit \\& Blitzvergleich\n\nArbeitsheft S. 10\nBleistift / Füllfeder"}, {"zeit": "10–20 Min *(Tafel-Wortschatz)*", "inhalt": "**Tafel-Blitz: „Die Blacklist der langweiligen Wörter“:**\n•  Lehrerimpuls: *„Wer morgen fünfmal ‚dann ging er‘ oder ‚er sagte‘ schreibt, verschenkt wertvolle Punkte beim Ausdruck!“*\n•  4 Spalten an die Tafel werfen und Schüler rufen lassen (oder an die Tafel schreiben lassen):\n  1. *gehen ➔* schleichen, pirschen, taumeln, eilen, huschen\n  2. *sehen ➔* erspähen, fixieren, belauern, durch die Dunkelheit spähen\n  3. *sagen ➔* zischen, flüstern, stammeln, drohen, hervorstoßen\n  4. *Angst ➔* Panik schnürt die Kehle zu, das Blut gefriert in den Adern, zitternde Knie, kalter Schweiß\n•  Schüler tragen ihre 3 persönlichen Favoriten pro Spalte auf dem Arbeitsblatt ein.", "sozial": "Plenum (Tafelarbeit) \\& Einzelübertrag\n\nTafelbild\nArbeitsblatt (Teil 1)"}, {"zeit": "20–40 Min *(Schreibwerkstatt)*", "inhalt": "**Die „5-Minuten-Zeitlupen-Challenge“ (Schreib-Sprint ins Heft):**\n•  Austeilen des Arbeitsblatts / Blick auf Aufgabe 2:\n•  **Wahl-Impuls A:** *„Die Türklinke der alten Villa bewegte sich langsam nach unten.“*\n•  **Wahl-Impuls B:** *„Mitten im dunklen Juweliergeschäft zerbrach plötzlich eine Glasscheibe.“*\n•  **Auftrag (Schulübungsheft, ca. 50–80 Wörter im Präteritum):** Dehne diesen Moment in extremer Zeitlupe aus! Verpflichtend einzubauen:\n  – Mindestens 1 Geräusch (*knarren, klirren, splittern*)\n  – Mindestens 1 Körperreaktion (*Herzklopfen, Atem anhalten, Gänsehaut*)\n  – Mindestens 1 innerer Monolog/Gedanke in Anführungszeichen (*„War das der Einbrecher?“*)\n•  **Min 32–40:** 3 Freiwillige lesen ihren Zeitlupen-Moment vor; Mitschüler prüfen: War es echte Zeitlupe?", "sozial": "Einzelarbeit (Schreib-Sprint)\n\nSchulübungsheft\nArbeitsblatt (Teil 2)"}, {"zeit": "40–50 Min *(Schluss \\& Checkliste)*", "inhalt": "**Der Schularbeits-Spickzettel \\& Mutmacher für morgen:**\n•  Kurzer Tafel-Check: Was gehört morgen zwingend auf den Notizzettel?\n  1. *Täter, Motiv \\& die eine entscheidende Spur (z. B. Schuhabdruck, Täterwissen, Geruch).*\n  2. *Wörtliche Rede mit abwechslungsreichen Begleitsätzen (Doppelpunkt und Redezeichen richtig setzen!).*\n  3. *Absätze machen (Einleitung / Hauptteil mit Höhepunkt / Schluss).*\n  4. *Am Ende: 5 Minuten für den Zeitformen-Check (Präteritum!).*\n•  Raum für letzte Schülerfragen zur Schularbeit.", "sozial": "Unterrichtsgespräch \\& Sicherung\n\nArbeitsblatt (Teil 3)\nTafel"}], "tafelbild": "```text\n================================================================================\n          GENERALPROBE 1. DEUTSCH-SCHULARBEIT: DER KRIMI-WERKZEUGKASTEN\n================================================================================\n\n1. DIE BLACKLIST DER LANGWEILIGEN WÖRTER (Wortschatz-Tresor):\n--------------------------------------------------------------------------------\n   GEHEN           | SEHEN          | SAGEN          | ANGST HABEN\n   ----------------+----------------+----------------+--------------------------\n   schleichen      | erspähen       | flüstern       | Panik schnürt die Kehle zu\n   pirschen        | fixieren       | zischen        | das Blut gefriert in den Adern\n   huschen         | mustern        | stammeln       | kalter Schweiß tritt auf die Stirn\n   taumeln         | belauern       | hervorstoßen   | zitternde Hände und Knie\n   hasten / eilen  | spähen         | knurren        | der Atem stockt\n\n--------------------------------------------------------------------------------\n2. DIE 3 GOLDENEN SCHULARBEITS-REGELN FÜR MORGEN:\n--------------------------------------------------------------------------------\n   ① ZEITLUPE AM HÖHEPUNKT:\n      Nicht sofort die Tür aufreißen oder schießen! Dehne den spannendsten Moment\n      mit Geräuschen, Körperreaktionen und Gedanken in Anführungszeichen!\n\n   ② DIE VERRÄTERISCHE SPUR:\n      Der Täter wird nicht durch Zufall geschnappt – son
